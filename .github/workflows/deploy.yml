name: Build and publish brochure pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 4 * * *"   # every day 04:15 UTC: picks up new PDFs from lykomitros-steel.gr
  workflow_dispatch: {}     # "Run workflow" button: refresh right after you change a PDF

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build.py _site
      - run: python tools/fetch_pdfs.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
